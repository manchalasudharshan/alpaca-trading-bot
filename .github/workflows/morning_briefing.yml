name: Morning Market Briefing

on:
  workflow_dispatch: {}
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      APCA_DATA_URL: https://data.alpaca.markets
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Generate and send morning briefing
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/reports
          python -m bot.reporting.morning_briefing 2>&1 | tee "results/reports/morning_$(date -u +%F).txt"
      - name: Commit report output (for audit, regardless of Telegram delivery)
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add results/reports/ 2>/dev/null || true
          git diff --cached --quiet && echo "No report changes to commit" || \
            git commit -m "Morning briefing ${{ github.run_id }} [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "push failed, see logs"
