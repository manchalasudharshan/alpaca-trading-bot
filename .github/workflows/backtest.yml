name: Run Backtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      APCA_DATA_URL: https://data.alpaca.markets
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        shell: bash
        run: |
          set -o pipefail
          python -m bot.backtest 2>&1 | tee backtest_console_output.txt

      - name: Upload results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest_results.png
            backtest_trades.csv
            backtest_console_output.txt
          if-no-files-found: warn

      # Artifact downloads redirect through Azure Blob Storage, which isn't
      # reachable from the sandboxed session that triggers this workflow --
      # so also commit the results straight into the repo (results/ dir,
      # overwritten each run) as a reliable, git-pullable fallback.
      - name: Commit results to repo
        if: always()
        run: |
          mkdir -p results
          cp -f backtest_console_output.txt results/ 2>/dev/null || true
          cp -f backtest_results.png results/ 2>/dev/null || true
          cp -f backtest_trades.csv results/ 2>/dev/null || true
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add results/
          git diff --cached --quiet && echo "No result changes to commit" || \
            git commit -m "Backtest results from run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:main || echo "push failed, see logs"
